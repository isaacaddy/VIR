services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: vir_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: dvla_db
      MYSQL_USER: vir_user
      MYSQL_PASSWORD: vir_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./DATABASE_STRUCTURE.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - vir_network

  # PHP Backend
  backend:
    build: .
    container_name: vir_backend
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - mysql
    environment:
      - DB_HOST=mysql
      - DB_NAME=dvla_db
      - DB_USER=vir_user
      - DB_PASSWORD=vir_password
    networks:
      - vir_network

  # Frontend
  frontend:
    build: ./frontend
    container_name: vir_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./frontend:/var/www/html
    depends_on:
      - backend
    networks:
      - vir_network

  # phpMyAdmin (optional)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: vir_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: rootpassword
    depends_on:
      - mysql
    networks:
      - vir_network

volumes:
  mysql_data:

networks:
  vir_network:
    driver: bridge
